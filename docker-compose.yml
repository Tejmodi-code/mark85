# Production stack: nginx (load balancer + static files) -> N stateless API replicas -> PgBouncer -> Postgres,
# plus the game engine (also replicated) and ONE live-tables process. See docs/DEPLOY.md.
x-api: &api
  build: { context: ., dockerfile: deploy/Dockerfile.api }
  restart: unless-stopped
  environment: &apienv
    ENV: prod
    AUTO_MIGRATE: "0"
    DATABASE_URL: postgresql+psycopg2://tej:${POSTGRES_PASSWORD}@pgbouncer:5432/tej
    ENGINE_URL: http://engine:8081
    LIVE_URL: http://live:8000
    ADMIN_KEY: ${ADMIN_KEY}
    WEB_CONCURRENCY: ${WEB_CONCURRENCY:-4}
    DB_POOL: "5"
    DB_OVERFLOW: "5"
    API_ADMISSION_MAX: ${API_ADMISSION_MAX:-10}
    API_ADMISSION_QUEUE: ${API_ADMISSION_QUEUE:-20}
    API_ADMISSION_WAIT_MS: ${API_ADMISSION_WAIT_MS:-150}
    API_ADMISSION_TARGET_MS: ${API_ADMISSION_TARGET_MS:-350}
    LIVE_ACTION_MAX_INFLIGHT: ${LIVE_ACTION_MAX_INFLIGHT:-16}
    LIVE_ACTION_QUEUE: ${LIVE_ACTION_QUEUE:-32}
    LIVE_ACTION_WAIT_MS: ${LIVE_ACTION_WAIT_MS:-150}
    LIVE_ACTION_TARGET_MS: ${LIVE_ACTION_TARGET_MS:-300}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment: { POSTGRES_USER: tej, POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}", POSTGRES_DB: tej }
    command: >
      postgres -c max_connections=200 -c shared_buffers=1GB -c effective_cache_size=3GB
      -c work_mem=8MB -c wal_compression=on -c checkpoint_timeout=15min -c max_wal_size=4GB
      -c synchronous_commit=on -c log_min_duration_statement=500
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U tej -d tej"], interval: 5s, timeout: 3s, retries: 10 }
    shm_size: 256mb

  # Transaction pooling: thousands of app connections share ~60 real Postgres connections.
  pgbouncer:
    image: edoburu/pgbouncer:v1.26.1-p0
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_USER: tej
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: tej
      POOL_MODE: transaction
      AUTH_TYPE: scram-sha-256
      MAX_CLIENT_CONN: "5000"
      DEFAULT_POOL_SIZE: "60"
    depends_on: { postgres: { condition: service_healthy } }
    healthcheck: { test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432"], interval: 5s, timeout: 3s, retries: 10 }

  engine:
    build: { context: ., dockerfile: deploy/Dockerfile.engine }
    restart: unless-stopped
    healthcheck: { test: ["CMD", "curl", "-fs", "http://127.0.0.1:8081/health"], interval: 5s, timeout: 2s, retries: 5 }

  migrate:
    <<: *api
    restart: "no"
    command: python migrate.py
    depends_on: { pgbouncer: { condition: service_healthy } }

  api:
    <<: *api
    environment: { <<: *apienv, ROLE: api }
    depends_on:
      migrate: { condition: service_completed_successfully }
      engine: { condition: service_healthy }
    healthcheck: { test: ["CMD", "curl", "-fs", "http://127.0.0.1:8000/healthz"], interval: 5s, timeout: 2s, retries: 5 }

  # Crash and Blackjack tables live in this one process. Do not scale it above 1 (see docs/SCALING.md).
  live:
    <<: *api
    environment: { <<: *apienv, ROLE: live, WEB_CONCURRENCY: "1" }
    depends_on:
      migrate: { condition: service_completed_successfully }
      engine: { condition: service_healthy }
    healthcheck: { test: ["CMD", "curl", "-fs", "http://127.0.0.1:8000/healthz"], interval: 5s, timeout: 2s, retries: 5 }

  nginx:
    build: { context: ., dockerfile: deploy/Dockerfile.nginx }
    restart: unless-stopped
    expose: ["8080"]
    depends_on: [api, live]
    ulimits: { nofile: { soft: 200000, hard: 200000 } }

  # Only the TLS edge is published. Caddy manages public certificates and redirects HTTP to HTTPS.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment: { SITE_HOST: "${SITE_HOST:-localhost}" }
    ports: ["${HTTP_PORT:-80}:80", "${HTTPS_PORT:-443}:443", "${HTTPS_PORT:-443}:443/udp"]
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [nginx]
    healthcheck: { test: ["CMD", "caddy", "validate", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile"], interval: 30s, timeout: 5s, retries: 3 }

volumes:
  pgdata:
  caddy_data:
  caddy_config:


