worker_processes auto;
worker_rlimit_nofile 200000;
pid /tmp/nginx.pid;

events {
    worker_connections 65535;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 10000;
    server_tokens off;

    # Trust forwarded client addresses only from the private Docker bridge used by this stack.
    set_real_ip_from 172.16.0.0/12;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;
    client_max_body_size 16k;
    client_header_timeout 10s;
    client_body_timeout 10s;
    send_timeout 15s;
    reset_timedout_connection on;

    log_format main '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent '
                    'rt=$request_time up=$upstream_addr urt=$upstream_response_time';
    access_log /var/log/nginx/access.log main buffer=64k flush=5s;
    error_log /var/log/nginx/error.log warn;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_types text/css application/javascript application/json image/svg+xml;

    proxy_connect_timeout 3s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;
    # Retry another replica only when the request never reached one. nginx does not retry a POST after a
    # timeout unless told to (non_idempotent), so a bet is never placed twice.
    proxy_next_upstream error http_502 http_503;
    proxy_next_upstream_tries 2;

    # The sponsor list changes rarely and every page view asks for it, so cache it for 30 seconds.
    proxy_cache_path /var/cache/nginx/sponsors keys_zone=sponsors:1m max_size=10m inactive=10m;

    map $http_upgrade $connection_upgrade { default upgrade; '' close; }

    # Per-IP limits. Many mobile users share one IP (carrier NAT), so these are generous on purpose.
    limit_req_zone $binary_remote_addr zone=auth:20m rate=30r/m;
    limit_req_zone $binary_remote_addr zone=play:50m rate=20r/s;
    limit_req_zone $binary_remote_addr zone=api:50m  rate=30r/s;
    limit_conn_zone $binary_remote_addr zone=perip:20m;
    limit_req_status 429;
    limit_conn_status 429;

    # Docker resolves "api" to every replica; scale with `docker compose up -d --scale api=N`, then reload nginx.
    resolver 127.0.0.11 valid=10s ipv6=off;
    upstream api {
        zone api 64k;
        least_conn;
        server api:8000 resolve max_fails=3 fail_timeout=10s;
        keepalive 256;
        keepalive_requests 10000;
    }
    # The live tables hold their state in one process, so there is exactly one of these.
    upstream live {
        zone live 64k;
        server live:8000 resolve;
        keepalive 16;
    }

    server {
        listen 8080 default_server;
        server_name _;
        root /usr/share/nginx/html;
        include /etc/nginx/snippets/security.conf;

        location = /healthz { access_log off; return 200 "ok\n"; }
        location = /readyz  { access_log off; include /etc/nginx/snippets/proxy.conf; proxy_pass http://api/readyz; }

        # Never exposed to the internet: internal endpoints, API docs, sponsor admin.
        location ~ ^/(internal|docs|redoc|openapi\.json|api/admin) { return 404; }

        location = /api/signup { limit_req zone=auth burst=20 nodelay; include /etc/nginx/snippets/proxy.conf; proxy_pass http://api; }
        location = /api/login  { limit_req zone=auth burst=20 nodelay; include /etc/nginx/snippets/proxy.conf; proxy_pass http://api; }
        location ~ ^/api/(play|solo/) { limit_req zone=play burst=40 nodelay; include /etc/nginx/snippets/proxy.conf; proxy_pass http://api; }
        location = /api/sponsors {
            limit_req zone=api burst=60 nodelay;
            include /etc/nginx/snippets/proxy.conf;
            proxy_cache sponsors;
            proxy_cache_valid 200 30s;
            proxy_cache_lock on;
            proxy_cache_use_stale error timeout updating;
            proxy_pass http://api;
        }
        location /api/ { limit_req zone=api burst=60 nodelay; include /etc/nginx/snippets/proxy.conf; proxy_pass http://api; }

        location /ws {
            limit_conn perip 30;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_pass http://live;
        }

        # Static files come straight from nginx. HTML, JS and CSS are revalidated (cheap 304), so a release shows up at once.
        location / {
            include /etc/nginx/snippets/security.conf;
            add_header Cache-Control "no-cache" always;
            try_files $uri /index.html;
        }
    }
}
