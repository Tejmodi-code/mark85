# TLS variant of the server block. Get a certificate first (certbot, or let Cloudflare terminate TLS).
# Replace the `server { listen 8080 ... }` block in nginx.conf with these two, mount /etc/letsencrypt into the
# nginx container, and publish port 443 in docker-compose.yml.
server {
    listen 8080;
    server_name example.com;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 8443 ssl;
    http2 on;
    server_name example.com;
    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:50m;
    ssl_session_timeout 1d;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # ...then the same location blocks as the plain server above.
}
